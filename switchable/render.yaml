services:
  - type: web
    name: open-switch
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: openswitch-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: OPENSWITCH_MODE
        value: hosted
      - key: DEMO_MODE
        value: "1"
      - key: MAX_ROWS
        value: "200"
      - key: MAX_UPLOAD_MB
        value: "2"
      - key: MAX_CONCURRENT_EXPERIMENTS
        value: "2"
      - key: MAX_EXPERIMENTS_PER_VISITOR_DAY
        value: "3"
      - key: EXPERIMENT_MAX_COST_USD
        value: "2.0"
      - key: GLOBAL_DAILY_BUDGET_USD
        value: "5.0"
      - key: KILL_SWITCH
        value: "0"
      - key: DATA_DIR
        value: /var/data
      - key: SENTRY_DSN
        sync: false
      - key: DO_MODEL_ACCESS_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: TINKER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: BASELINE_API_KEY
        sync: false
